site_name: files2db
site_description: Documentation for files2db
site_url: https://louislenezet.github.io/files2db/

theme:
  name: readthedocs
  logo: assets/logo_files2db.svg
  favicon: assets/logo_files2db.png
  palette:
    primary: teal
    accent: blue

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.snippets

nav:
  - Home: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - CLI: cli.md
